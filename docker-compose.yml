services:
  wordpress:
    build: .
    restart: unless-stopped
    environment:
      # DB is a separate Dokploy MySQL service — DB_HOST is its appName on
      # dokploy-network (set in the Dokploy env, no bundled db here).
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME:-amu}
      WORDPRESS_DB_USER: ${DB_USER:-amu}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_URL:-https://animemangaupdates.com}');
        define('WP_SITEURL', '${WP_URL:-https://animemangaupdates.com}');
        define('WP_MEMORY_LIMIT', '256M');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - amu_wpcontent:/var/www/html/wp-content

# Ingress (Traefik labels + dokploy-network) is added by Dokploy when a domain is
# attached to the `wordpress` service — don't hardcode it.

volumes:
  amu_wpcontent:
